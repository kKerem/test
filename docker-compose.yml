version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prensmedya-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: switchyard.proxy.rlwy.net
      DB_HOST: db
      DB_PORT: 35180
      DB_DATABASE: railway
      DB_USERNAME: root
      DB_PASSWORD: YtNTAAqzyzDiBCIGFwTRglORSvhfDauU
      REDIS_HOST: redis
    depends_on:
      - db
      - redis

  web:
    image: nginx:1.27-alpine
    container_name: prensmedya-web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: prensmedya-db
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: prensmedya
      MYSQL_USER: prensmedya
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: prensmedya-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  db_data:


