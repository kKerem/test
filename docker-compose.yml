version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prensmedya-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000

      # Lokal geliştirme için PORT
      PORT: 8080

      # Eğer lokalda Railway DB'ye bağlanıyorsan bırak, yoksa lokal DB ayarlarını kullan
      DB_HOST: mysql.railway.internal        # RAILWAY_TCP_PROXY_DOMAIN
      DB_PORT: 3306                            # RAILWAY_TCP_PROXY_PORT (örnek)
      DB_DATABASE: railway
      DB_USERNAME: root
      DB_PASSWORD: QmgzvrGzKsBuklJUAOXyHAXdXZnPCzOT

      REDIS_HOST: redis
    depends_on:
      - redis

  web:
    image: nginx:1.27-alpine
    container_name: prensmedya-web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  redis:
    image: redis:7-alpine
    container_name: prensmedya-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
