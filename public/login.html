<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <title>Giriş - PrensMedya</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
</head>
<body class="min-h-screen flex items-center justify-center p-5 bg-gradient-to-br from-slate-900 to-slate-800 text-slate-200">
  <div class="w-full max-w-md bg-slate-950 border border-slate-800 rounded-xl p-10 shadow-2xl">
    <h1 class="text-3xl mb-2 text-center">PrensMedya</h1>
    <div class="text-center text-slate-500 text-sm mb-8">Site Editörüne Giriş Yap</div>
    
    <div class="hidden bg-red-950 border border-red-900 text-red-300 p-3 rounded-lg mb-5 text-sm" id="error-message"></div>
    <div class="hidden bg-green-950 border border-green-900 text-green-300 p-3 rounded-lg mb-5 text-sm" id="success-message"></div>
    
    <form id="login-form">
      <div class="mb-5">
        <label for="identifier" class="block mb-2 text-sm text-slate-300">Kullanıcı Adı veya E-posta</label>
        <input type="text" id="identifier" name="identifier" placeholder="Kullanıcı adı veya e-posta" required autofocus class="w-full px-4 py-3 rounded-lg border border-slate-800 bg-slate-900 text-slate-200 text-sm transition-all focus:outline-none focus:border-gray-600 focus:bg-slate-800">
      </div>
      <div class="mb-5">
        <label for="password" class="block mb-2 text-sm text-slate-300">Şifre</label>
        <input type="password" id="password" name="password" placeholder="Şifre" required class="w-full px-4 py-3 rounded-lg border border-slate-800 bg-slate-900 text-slate-200 text-sm transition-all focus:outline-none focus:border-gray-600 focus:bg-slate-800">
      </div>
      <button type="submit" class="w-full py-3 rounded-lg border-none text-base font-semibold cursor-pointer transition-all mb-3 bg-gray-700 text-white hover:bg-gray-600">Giriş Yap</button>
    </form>
    
    <button type="button" class="w-full py-3 rounded-lg border-none text-base font-semibold cursor-pointer transition-all mb-3 bg-transparent text-slate-200 border border-slate-800 hover:bg-slate-800 hover:border-slate-700" id="register-btn">Kayıt Ol</button>
    
    <div class="text-center mt-5 text-sm text-slate-500">
      Hesabınız yok mu? <a href="#" id="register-link" class="text-gray-300 no-underline hover:underline">Kayıt olun</a>
    </div>
  </div>

  <script>
    const errorEl = document.getElementById('error-message');
    const successEl = document.getElementById('success-message');
    
    function showError(msg) {
      errorEl.textContent = msg;
      errorEl.classList.remove('hidden');
      errorEl.classList.add('block');
      successEl.classList.add('hidden');
      successEl.classList.remove('block');
      setTimeout(() => {
        errorEl.classList.add('hidden');
        errorEl.classList.remove('block');
      }, 5000);
    }
    
    function showSuccess(msg) {
      successEl.textContent = msg;
      successEl.classList.remove('hidden');
      successEl.classList.add('block');
      errorEl.classList.add('hidden');
      errorEl.classList.remove('block');
    }
    
    async function api(url, options = {}) {
      const response = await fetch(url, {
        ...options,
        credentials: 'include',
        headers: {
          'Content-Type': 'application/json',
          ...options.headers,
        },
      });
      
      if (!response.ok) {
        const data = await response.json().catch(() => ({}));
        throw new Error(data.error || `HTTP ${response.status}`);
      }
      
      return response.json();
    }
    
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const identifier = document.getElementById('identifier').value.trim();
      const password = document.getElementById('password').value;
      
      if (!identifier || !password) {
        showError('Lütfen tüm alanları doldurun');
        return;
      }
      
      try {
        const result = await api('/api/auth/login', {
          method: 'POST',
          body: JSON.stringify({ email: identifier, password }),
        });
        
        showSuccess('Giriş başarılı! Yönlendiriliyorsunuz...');
        
        // 1 saniye sonra yönlendir
        setTimeout(() => {
          window.location.href = '/';
        }, 1000);
      } catch (e) {
        showError(e.message || 'Giriş yapılamadı');
      }
    });
    
    document.getElementById('register-btn').addEventListener('click', () => {
      const identifier = document.getElementById('identifier').value.trim();
      const password = document.getElementById('password').value;
      
      if (!identifier || !password) {
        showError('Lütfen kullanıcı adı/e-posta ve şifre girin');
        return;
      }
      
      // E-posta formatı kontrolü (basit)
      const isEmail = identifier.includes('@');
      const name = isEmail ? identifier.split('@')[0] : identifier;
      const email = isEmail ? identifier : identifier + '@example.com';
      
      api('/api/auth/register', {
        method: 'POST',
        body: JSON.stringify({ name, email, password }),
      })
      .then((result) => {
        showSuccess('Kayıt başarılı! Giriş yapılıyor...');
        setTimeout(() => {
          window.location.href = '/';
        }, 1000);
      })
      .catch((e) => {
        showError(e.message || 'Kayıt yapılamadı');
      });
    });
    
    document.getElementById('register-link').addEventListener('click', (e) => {
      e.preventDefault();
      document.getElementById('register-btn').click();
    });
  </script>
</body>
</html>
